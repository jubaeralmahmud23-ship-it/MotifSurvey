name: Package checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel and validation dependency
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[validation]'])"
      - name: Verify installed wheel
        run: python tools/check_release.py --output check-results/wheel
      - name: Install built source distribution
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/*.tar.gz')[0]])"
      - name: Verify source installation
        run: python -m unittest discover -s tests -v
      - name: Verify research companion
        run: python tools/check_research_companion.py --output check-results/companion
      - name: Audit exact identities and archived results
        run: python validation/audit/run_audit.py --output check-results/audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: check-results/
          if-no-files-found: error
  minimum-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - run: python -m pip install build numpy==1.24.0 networkx==3.4.2
      - run: python -m build
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',glob.glob('dist/*.whl')[0]])"
      - run: python tools/check_release.py --output check-results/minimum
      - run: python tools/check_research_companion.py --output check-results/companion
      - name: Audit exact identities and archived results
        run: python validation/audit/run_audit.py --output check-results/audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: checks-minimum-dependency
          path: check-results/
