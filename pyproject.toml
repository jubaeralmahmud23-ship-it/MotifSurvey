[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motifsurvey-prototype"
version = "0.2.1"
authors = [{name = "Jubaer Al Mahmud", email = "jubaeralmahmud23@gmail.com"}]
description = "Design-based motif totals and covariance for independently sampled nodes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"
license-files = ["LICENSE", "Licence.txt"]
keywords = ["network sampling", "motifs", "Horvitz-Thompson", "survey statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
validation = [
  "networkx==3.4.2; python_version < '3.11'",
  "networkx==3.6.1; python_version >= '3.11'",
]

[project.scripts]
motifsurvey = "motifsurvey.__main__:main"

[project.urls]
Repository = "https://github.com/jubaeralmahmud23-ship-it/MotifSurvey"

[tool.setuptools.packages.find]
where = ["src"]
